<title>Конструктор графиков</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
:root{
  --ground:#F6F5F4; --surface:#FFFFFF; --surface-2:#FBFAFD;
  --ink:#141414; --muted:#6B6478; --faint:#9A93AB;
  --accent:#7C3AED; --accent-ink:#5B21B6; --accent-soft:#EFE9FC;
  --lime:#CDEB00; --lime-line:#9DB300;
  --second:#E8590C; --second-soft:#FDEEE3;
  --line:#E4DEF0; --line-soft:#EFEBF6;
  --grid:#E9E4F3; --grid-bold:#D9D1EA; --axis:#7A7390;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#15121C; --surface:#1E1A29; --surface-2:#241F31;
    --ink:#F3F1F7; --muted:#A79FBA; --faint:#7C748F;
    --accent:#A78BFA; --accent-ink:#C4B5FD; --accent-soft:#2A2340;
    --lime:#CDEB00; --lime-line:#CDEB00;
    --second:#FF9F5A; --second-soft:#33200F;
    --line:#302A40; --line-soft:#282237;
    --grid:#2A2438; --grid-bold:#3A3350; --axis:#8C84A3;
  }
}
:root[data-theme="dark"]{
  --ground:#15121C; --surface:#1E1A29; --surface-2:#241F31;
  --ink:#F3F1F7; --muted:#A79FBA; --faint:#7C748F;
  --accent:#A78BFA; --accent-ink:#C4B5FD; --accent-soft:#2A2340;
  --lime:#CDEB00; --lime-line:#CDEB00;
  --second:#FF9F5A; --second-soft:#33200F;
  --line:#302A40; --line-soft:#282237;
  --grid:#2A2438; --grid-bold:#3A3350; --axis:#8C84A3;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; overflow:hidden}

.app{height:100%; display:grid; grid-template-columns:minmax(0,1fr) 288px}
.app[data-panel="off"]{grid-template-columns:minmax(0,1fr)}
.app[data-panel="off"] .panel{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) auto}
  .panel{border-left:0 !important; border-top:1px solid var(--line);
    max-height:46vh; overflow-y:auto}
}

/* ── холст ── */
.stage{position:relative; min-width:0; min-height:0; background:var(--surface)}
canvas{display:block; width:100%; height:100%}

.badge{position:absolute; left:16px; top:14px; display:flex; gap:8px; flex-wrap:wrap;
  pointer-events:none}
.pill{font-family:var(--mono); font-size:15px; font-weight:700; padding:7px 14px;
  border-radius:999px; background:var(--accent-soft); color:var(--accent-ink);
  border:1px solid transparent}
.pill.two{background:var(--second-soft); color:var(--second)}
.pill.meet{background:var(--surface-2); color:var(--muted); border-color:var(--line);
  font-weight:500}

.stage-tools{position:absolute; right:14px; top:13px; display:flex; gap:7px}
.icon-btn{font-family:var(--sans); font-size:12.5px; font-weight:600; padding:7px 12px;
  border-radius:9px; border:1px solid var(--line); background:var(--surface);
  color:var(--muted); cursor:pointer; transition:all .14s}
.icon-btn:hover{border-color:var(--accent); color:var(--accent-ink)}

/* ── панель ── */
.panel{border-left:1px solid var(--line); background:var(--surface-2);
  padding:20px 20px 22px; display:flex; flex-direction:column; gap:18px;
  overflow-y:auto}
.grp{display:flex; flex-direction:column; gap:9px}
.cap{font-family:var(--mono); font-size:10.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--faint); font-weight:500}

.seg{display:flex; gap:5px; background:var(--surface); border:1px solid var(--line);
  border-radius:11px; padding:4px}
.seg button{flex:1; font-family:var(--sans); font-size:13.5px; font-weight:700;
  padding:9px 6px; border-radius:8px; border:0; background:none; color:var(--muted);
  cursor:pointer; transition:all .14s}
.seg button:hover{color:var(--accent-ink)}
.seg button[aria-pressed="true"]{background:var(--accent); color:#fff}

.slider{display:flex; flex-direction:column; gap:5px}
.slider .row{display:flex; align-items:baseline; gap:9px}
.slider .name{font-family:var(--mono); font-size:14px; font-weight:700; color:var(--muted)}
.slider .val{font-family:var(--mono); font-size:26px; font-weight:700; line-height:1;
  color:var(--accent); font-variant-numeric:tabular-nums; margin-left:auto}
.slider.two .val{color:var(--second)}
input[type=range]{width:100%; accent-color:var(--accent); margin:0}
.slider.two input[type=range]{accent-color:var(--second)}

.check{display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--muted);
  cursor:pointer}
.check input{accent-color:var(--accent); width:16px; height:16px; cursor:pointer}

.readout{font-family:var(--mono); font-size:12.5px; color:var(--muted); line-height:1.85;
  background:var(--surface); border:1px solid var(--line); border-radius:11px;
  padding:12px 14px}
.readout b{color:var(--ink)}
.readout .hl{color:var(--accent)}

.btn{font-family:var(--sans); font-size:13px; font-weight:600; padding:9px 14px;
  border-radius:9px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink); cursor:pointer; transition:all .14s; width:100%}
.btn:hover{border-color:var(--accent); color:var(--accent-ink)}
.btn-row{display:flex; gap:7px}

.presets{display:flex; gap:6px; flex-wrap:wrap}
.chip{font-family:var(--mono); font-size:12px; padding:6px 11px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  cursor:pointer; transition:all .14s}
.chip:hover{border-color:var(--accent); color:var(--accent-ink)}

.foot{margin-top:auto; font-size:11.5px; color:var(--faint); line-height:1.5}
.foot b{color:var(--muted); font-weight:700}

:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>

<div class="app" id="app" data-panel="on">

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="badge">
      <span class="pill" id="f1"></span>
      <span class="pill two" id="f2" hidden></span>
      <span class="pill meet" id="meet" hidden></span>
    </div>
    <div class="stage-tools">
      <button class="icon-btn" id="panelBtn" type="button">Скрыть панель</button>
      <button class="icon-btn" id="themeBtn" type="button">Тема</button>
    </div>
  </div>

  <aside class="panel" id="panel">
    <div class="grp">
      <span class="cap">Тип функции</span>
      <div class="seg" id="modeSeg">
        <button type="button" data-mode="line" aria-pressed="true">Прямая</button>
        <button type="button" data-mode="hyp" aria-pressed="false">Гипербола</button>
      </div>
    </div>

    <div class="grp" id="lineCtrls">
      <div class="slider">
        <div class="row"><span class="name">k</span>
          <span class="cap" style="letter-spacing:.06em">наклон</span>
          <span class="val" id="kOut">2</span></div>
        <input type="range" id="k" min="-10" max="10" step="0.5" value="2">
      </div>
      <div class="slider">
        <div class="row"><span class="name">b</span>
          <span class="cap" style="letter-spacing:.06em">старт</span>
          <span class="val" id="bOut">0</span></div>
        <input type="range" id="b" min="-12" max="12" step="1" value="0">
      </div>
    </div>

    <div class="grp" id="hypCtrls" hidden>
      <div class="slider">
        <div class="row"><span class="name">k</span>
          <span class="cap" style="letter-spacing:.06em">числитель</span>
          <span class="val" id="hkOut">12</span></div>
        <input type="range" id="hk" min="-24" max="24" step="1" value="12">
      </div>
      <div class="presets">
        <button class="chip" type="button" data-hk="6">6</button>
        <button class="chip" type="button" data-hk="12">12</button>
        <button class="chip" type="button" data-hk="24">24</button>
        <button class="chip" type="button" data-hk="-12">−12</button>
      </div>
    </div>

    <div class="grp">
      <label class="check"><input type="checkbox" id="use2"> Вторая линия</label>
      <div id="secondCtrls" hidden style="display:flex;flex-direction:column;gap:9px">
        <div class="slider two">
          <div class="row"><span class="name">k₂</span>
            <span class="val" id="k2Out">1</span></div>
          <input type="range" id="k2" min="-10" max="10" step="0.5" value="1">
        </div>
        <div class="slider two" id="b2Wrap">
          <div class="row"><span class="name">b₂</span>
            <span class="val" id="b2Out">6</span></div>
          <input type="range" id="b2" min="-12" max="12" step="1" value="6">
        </div>
      </div>
    </div>

    <div class="grp">
      <span class="cap">Показывать</span>
      <label class="check"><input type="checkbox" id="showGrid" checked> Сетку</label>
      <label class="check"><input type="checkbox" id="showPts" checked> Точки с целыми координатами</label>
      <label class="check"><input type="checkbox" id="showAsym" checked> Асимптоты (для гиперболы)</label>
    </div>

    <div class="readout" id="readout"></div>

    <div class="btn-row">
      <button class="btn" type="button" id="copyBtn">Ссылка на этот вид</button>
    </div>

    <div class="foot">
      <b>ДенВал научит!</b><br>
      Колесо мыши — масштаб. Перетаскивание — сдвиг области.
    </div>
  </aside>
</div>

<script>
(function(){
  "use strict";

  var app = document.getElementById("app");
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var stage = document.getElementById("stage");

  var S = {
    mode:"line", k:2, b:0, hk:12,
    use2:false, k2:1, b2:6,
    grid:true, pts:true, asym:true,
    range:13, cx:0, cy:0            // cx/cy — сдвиг центра в единицах
  };

  /* ── чтение параметров из ссылки ── */
  (function readParams(){
    var q = new URLSearchParams(location.search);
    if (location.hash.length > 1){
      new URLSearchParams(location.hash.slice(1)).forEach(function(v, key){
        if (!q.has(key)) q.set(key, v);
      });
    }
    var num = function(name, min, max){
      if (!q.has(name)) return null;
      var v = parseFloat(q.get(name).replace(",", "."));
      return isFinite(v) ? Math.max(min, Math.min(max, v)) : null;
    };
    var m = q.get("mode");
    if (m === "hyp" || m === "line") S.mode = m;
    var v;
    if ((v = num("k", -10, 10)) !== null) S.k = v;
    if ((v = num("b", -12, 12)) !== null) S.b = v;
    if ((v = num("hk", -24, 24)) !== null) S.hk = Math.round(v) || 1;
    if ((v = num("k2", -10, 10)) !== null){ S.k2 = v; S.use2 = true; }
    if ((v = num("b2", -12, 12)) !== null){ S.b2 = v; S.use2 = true; }
    if (q.get("two") === "1") S.use2 = true;
    if ((v = num("zoom", 4, 40)) !== null) S.range = v;
    if (q.get("panel") === "off") app.setAttribute("data-panel", "off");
    if (q.get("theme") === "dark" || q.get("theme") === "light")
      document.documentElement.setAttribute("data-theme", q.get("theme"));
  })();

  /* ── синхронизация контролов ── */
  var el = {
    k:document.getElementById("k"), b:document.getElementById("b"),
    hk:document.getElementById("hk"), k2:document.getElementById("k2"),
    b2:document.getElementById("b2"), use2:document.getElementById("use2"),
    grid:document.getElementById("showGrid"), pts:document.getElementById("showPts"),
    asym:document.getElementById("showAsym")
  };
  function pushToControls(){
    el.k.value = S.k; el.b.value = S.b; el.hk.value = S.hk;
    el.k2.value = S.k2; el.b2.value = S.b2; el.use2.checked = S.use2;
    el.grid.checked = S.grid; el.pts.checked = S.pts; el.asym.checked = S.asym;
    document.getElementById("secondCtrls").hidden = !S.use2;
    document.getElementById("b2Wrap").style.display = (S.mode === "hyp") ? "none" : "";
    document.getElementById("lineCtrls").hidden = (S.mode !== "line");
    document.getElementById("hypCtrls").hidden = (S.mode !== "hyp");
    document.querySelectorAll("#modeSeg button").forEach(function(btn){
      btn.setAttribute("aria-pressed", String(btn.getAttribute("data-mode") === S.mode));
    });
  }

  /* ── геометрия холста ── */
  var W = 0, H = 0, UNIT = 1, OX = 0, OY = 0;

  function resize(){
    var r = stage.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(320, Math.round(r.width));
    H = Math.max(240, Math.round(r.height));
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function fit(){
    var pad = 26;
    UNIT = Math.min((W - pad * 2) / (S.range * 2), (H - pad * 2) / (S.range * 2));
    OX = W / 2 - S.cx * UNIT;
    OY = H / 2 + S.cy * UNIT;
  }
  function X(x){ return OX + x * UNIT; }
  function Y(y){ return OY - y * UNIT; }
  function invX(px){ return (px - OX) / UNIT; }
  function invY(py){ return (OY - py) / UNIT; }

  function css(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  function fmt(v){
    var r = Math.round(v * 100) / 100;
    return String(r).replace(".", ",");
  }
  function signed(v){ return (v < 0 ? "− " : "+ ") + fmt(Math.abs(v)); }
  function kPart(k){
    if (Math.abs(k - 1) < 1e-9) return "x";
    if (Math.abs(k + 1) < 1e-9) return "−x";
    if (Math.abs(k) < 1e-9) return "0";
    return fmt(k) + "x";
  }
  function lineLabel(k, b){
    if (Math.abs(k) < 1e-9) return "y = " + fmt(b);
    if (b === 0) return "y = " + kPart(k);
    return "y = " + kPart(k) + " " + signed(b);
  }

  /* ── шаг сетки под масштаб ── */
  function gridStep(){
    var raw = S.range / 6;
    var steps = [0.5, 1, 2, 5, 10, 20, 50, 100];
    for (var i = 0; i < steps.length; i++) if (raw <= steps[i]) return steps[i];
    return 100;
  }

  function draw(){
    fit();
    var c = {
      surface:css("--surface"), grid:css("--grid"), gridBold:css("--grid-bold"),
      axis:css("--axis"), accent:css("--accent"), second:css("--second"),
      lime:css("--lime-line"), faint:css("--faint"), ink:css("--ink")
    };

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = c.surface;
    ctx.fillRect(0, 0, W, H);

    var left = invX(0), right = invX(W), bottom = invY(H), top = invY(0);
    var st = gridStep();

    // сетка
    if (S.grid){
      ctx.lineWidth = 1;
      var g0 = Math.floor(left / st) * st;
      for (var gx = g0; gx <= right; gx += st){
        ctx.strokeStyle = (Math.abs(gx % (st * 5)) < st / 100) ? c.gridBold : c.grid;
        ctx.beginPath(); ctx.moveTo(X(gx), 0); ctx.lineTo(X(gx), H); ctx.stroke();
      }
      var h0 = Math.floor(bottom / st) * st;
      for (var gy = h0; gy <= top; gy += st){
        ctx.strokeStyle = (Math.abs(gy % (st * 5)) < st / 100) ? c.gridBold : c.grid;
        ctx.beginPath(); ctx.moveTo(0, Y(gy)); ctx.lineTo(W, Y(gy)); ctx.stroke();
      }
    }

    // оси
    ctx.strokeStyle = c.axis; ctx.lineWidth = 1.7;
    ctx.beginPath(); ctx.moveTo(0, Y(0)); ctx.lineTo(W, Y(0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X(0), 0); ctx.lineTo(X(0), H); ctx.stroke();

    // асимптоты гиперболы — поверх осей
    if (S.mode === "hyp" && S.asym){
      ctx.save();
      ctx.setLineDash([10, 8]); ctx.lineCap = "round";
      ctx.strokeStyle = c.lime; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(0, Y(0)); ctx.lineTo(W, Y(0)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X(0), 0); ctx.lineTo(X(0), H); ctx.stroke();
      ctx.restore();
    }

    // подписи делений
    ctx.fillStyle = c.faint;
    ctx.font = "500 " + Math.max(11, Math.round(UNIT * 0.34)) + "px " + "'JetBrains Mono', monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    var lab = st * (UNIT * st < 34 ? 2 : 1);
    for (var tx = Math.ceil(left / lab) * lab; tx <= right; tx += lab){
      if (Math.abs(tx) < 1e-9) continue;
      ctx.fillText(fmt(tx), X(tx), Y(0) + 7);
    }
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    for (var ty = Math.ceil(bottom / lab) * lab; ty <= top; ty += lab){
      if (Math.abs(ty) < 1e-9) continue;
      ctx.fillText(fmt(ty), X(0) - 8, Y(ty));
    }
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.fillText("x", W - 18, Y(0) - 10);
    ctx.fillText("y", X(0) + 10, 20);

    // кривые
    if (S.mode === "line"){
      drawLine(S.k, S.b, c.accent, left, right);
      if (S.use2) drawLine(S.k2, S.b2, c.second, left, right);
      if (S.pts){
        markLinePts(S.k, S.b, c.accent, left, right);
        if (S.use2) markLinePts(S.k2, S.b2, c.second, left, right);
      }
    } else {
      drawHyp(S.hk, c.accent, left, right, bottom, top);
      if (S.use2) drawLine(S.k2, S.b2, c.second, left, right);
      if (S.pts) markHypPts(S.hk, c.accent);
    }

    // точка пересечения
    var meet = intersection();
    if (meet){
      ctx.beginPath();
      ctx.arc(X(meet.x), Y(meet.y), 9, 0, Math.PI * 2);
      ctx.fillStyle = c.surface; ctx.fill();
      ctx.lineWidth = 3.5; ctx.strokeStyle = c.ink; ctx.stroke();
      ctx.beginPath();
      ctx.arc(X(meet.x), Y(meet.y), 3.5, 0, Math.PI * 2);
      ctx.fillStyle = c.ink; ctx.fill();
    }

    updateBadges(meet);
  }

  function drawLine(k, b, color, left, right){
    ctx.strokeStyle = color; ctx.lineWidth = 3.6; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(X(left), Y(k * left + b));
    ctx.lineTo(X(right), Y(k * right + b));
    ctx.stroke();
  }

  function drawHyp(k, color, left, right, bottom, top){
    if (k === 0) k = 1;
    ctx.strokeStyle = color; ctx.lineWidth = 3.6; ctx.lineJoin = "round";
    [1, -1].forEach(function(sign){
      ctx.beginPath();
      var started = false, N = 1400;
      var span = Math.max(Math.abs(left), Math.abs(right)) + 1;
      for (var i = 1; i <= N; i++){
        var x = sign * (span * i / N);
        var y = k / x;
        if (y > top + 2 || y < bottom - 2){ started = false; continue; }
        if (!started){ ctx.moveTo(X(x), Y(y)); started = true; }
        else ctx.lineTo(X(x), Y(y));
      }
      ctx.stroke();
    });
  }

  function dot(x, y, color){
    ctx.beginPath();
    ctx.arc(X(x), Y(y), 5.5, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = css("--surface"); ctx.stroke();
  }

  function markLinePts(k, b, color, left, right){
    if (UNIT < 14) return;
    var hits = [];
    for (var x = Math.ceil(left); x <= right; x++){
      var y = k * x + b;
      if (Math.abs(y - Math.round(y)) < 1e-9) hits.push([x, Math.round(y)]);
    }
    // на пологой прямой целых точек десятки — прореживаем, иначе линия
    // превращается в пунктир и перестаёт читаться
    var step = Math.max(1, Math.ceil(hits.length / 12));
    for (var i = 0; i < hits.length; i += step) dot(hits[i][0], hits[i][1], color);
  }

  function markHypPts(k, color){
    if (UNIT < 12) return;
    for (var d = 1; d <= Math.abs(k); d++){
      if (k % d === 0){
        dot(d, k / d, color);
        dot(-d, -k / d, color);
      }
    }
  }

  function intersection(){
    if (!S.use2) return null;
    if (S.mode === "line"){
      if (Math.abs(S.k - S.k2) < 1e-9) return null;
      var x = (S.b2 - S.b) / (S.k - S.k2);
      return { x:x, y:S.k * x + S.b };
    }
    // гипербола и прямая: k/x = k2 x + b2  →  k2 x² + b2 x − k = 0
    var a = S.k2, bb = S.b2, cc = -S.hk;
    if (Math.abs(a) < 1e-9){
      if (Math.abs(bb) < 1e-9) return null;
      var xl = S.hk / bb;
      return { x:xl, y:bb };
    }
    var D = bb * bb - 4 * a * cc;
    if (D < 0) return null;
    var r1 = (-bb + Math.sqrt(D)) / (2 * a);
    var r2 = (-bb - Math.sqrt(D)) / (2 * a);
    var pick = (Math.abs(r1) < Math.abs(r2) && r1 !== 0) || r2 === 0 ? r1 : r2;
    if (!isFinite(pick) || pick === 0) return null;
    return { x:pick, y:S.hk / pick };
  }

  function updateBadges(meet){
    var f1 = document.getElementById("f1");
    var f2 = document.getElementById("f2");
    var mt = document.getElementById("meet");

    f1.textContent = (S.mode === "line")
      ? lineLabel(S.k, S.b)
      : "y = " + (S.hk < 0 ? "−" + Math.abs(S.hk) : S.hk) + " / x";
    f2.hidden = !S.use2;
    if (S.use2) f2.textContent = lineLabel(S.k2, S.b2);

    mt.hidden = !meet;
    if (meet) mt.textContent = "пересечение (" + fmt(meet.x) + "; " + fmt(meet.y) + ")";

    var lines = [];
    if (S.mode === "line"){
      lines.push("k = <b>" + fmt(S.k) + "</b> — " +
        (S.k > 0 ? "растёт" : S.k < 0 ? "убывает" : "стоит на месте"));
      lines.push("b = <b>" + fmt(S.b) + "</b> — пересекает Oy в (0; " + fmt(S.b) + ")");
      if (Math.abs(S.k) > 1e-9)
        lines.push("пересекает Ox в (<b>" + fmt(-S.b / S.k) + "</b>; 0)");
      else
        lines.push("параллельна оси Ox");
      if (S.use2 && Math.abs(S.k - S.k2) < 1e-9)
        lines.push('<span class="hl">прямые параллельны</span>');
    } else {
      lines.push("ветви в четвертях: <b>" + (S.hk > 0 ? "I и III" : "II и IV") + "</b>");
      lines.push("асимптоты — <b>обе оси</b>");
      var pts = [];
      for (var d = 1; d <= Math.abs(S.hk) && pts.length < 4; d++)
        if (S.hk % d === 0) pts.push("(" + d + "; " + S.hk / d + ")");
      if (pts.length) lines.push("точки: <b>" + pts.join(" ") + "</b>");
    }
    if (meet) lines.push('<span class="hl">встреча при x = ' + fmt(meet.x) + "</span>");
    document.getElementById("readout").innerHTML = lines.join("<br>");

    document.getElementById("kOut").textContent = fmt(S.k);
    document.getElementById("bOut").textContent = fmt(S.b);
    document.getElementById("hkOut").textContent = (S.hk < 0 ? "−" : "") + Math.abs(S.hk);
    document.getElementById("k2Out").textContent = fmt(S.k2);
    document.getElementById("b2Out").textContent = fmt(S.b2);
  }

  /* ── события ── */
  document.querySelectorAll("#modeSeg button").forEach(function(btn){
    btn.addEventListener("click", function(){
      S.mode = btn.getAttribute("data-mode");
      pushToControls(); draw();
    });
  });
  ["k","b","hk","k2","b2"].forEach(function(name){
    el[name].addEventListener("input", function(){
      S[name] = parseFloat(el[name].value);
      if (name === "hk" && S.hk === 0){ S.hk = 1; el.hk.value = 1; }
      draw();
    });
  });
  el.use2.addEventListener("change", function(){
    S.use2 = el.use2.checked;
    document.getElementById("secondCtrls").hidden = !S.use2;
    draw();
  });
  [["grid","grid"],["pts","pts"],["asym","asym"]].forEach(function(p){
    el[p[0]].addEventListener("change", function(){ S[p[1]] = el[p[0]].checked; draw(); });
  });
  document.querySelectorAll("[data-hk]").forEach(function(ch){
    ch.addEventListener("click", function(){
      S.hk = parseInt(ch.getAttribute("data-hk"), 10);
      el.hk.value = S.hk; draw();
    });
  });

  document.getElementById("panelBtn").addEventListener("click", function(){
    var off = app.getAttribute("data-panel") === "off";
    app.setAttribute("data-panel", off ? "on" : "off");
    this.textContent = off ? "Скрыть панель" : "Показать панель";
    requestAnimationFrame(resize);
  });
  document.getElementById("themeBtn").addEventListener("click", function(){
    var root = document.documentElement, now = root.getAttribute("data-theme");
    var dark = now ? now === "dark"
                   : window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.setAttribute("data-theme", dark ? "light" : "dark");
    draw();
  });

  document.getElementById("copyBtn").addEventListener("click", function(){
    var p = new URLSearchParams();
    p.set("mode", S.mode);
    if (S.mode === "line"){ p.set("k", S.k); p.set("b", S.b); }
    else p.set("hk", S.hk);
    if (S.use2){ p.set("k2", S.k2); p.set("b2", S.b2); p.set("two", "1"); }
    if (Math.round(S.range) !== 13) p.set("zoom", Math.round(S.range));
    var url = location.origin + location.pathname + "#" + p.toString();
    var btn = this;
    var done = function(){
      btn.textContent = "Скопировано";
      setTimeout(function(){ btn.textContent = "Ссылка на этот вид"; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(url).then(done, function(){});
    else { prompt("Скопируй ссылку:", url); }
  });

  /* ── масштаб и перетаскивание ── */
  stage.addEventListener("wheel", function(e){
    e.preventDefault();
    var f = e.deltaY > 0 ? 1.12 : 1 / 1.12;
    S.range = Math.max(4, Math.min(40, S.range * f));
    draw();
  }, { passive:false });

  var drag = null;
  stage.addEventListener("pointerdown", function(e){
    if (e.target.closest(".stage-tools")) return;
    drag = { px:e.clientX, py:e.clientY, cx:S.cx, cy:S.cy };
    stage.setPointerCapture(e.pointerId);
    stage.style.cursor = "grabbing";
  });
  stage.addEventListener("pointermove", function(e){
    if (!drag) return;
    S.cx = drag.cx - (e.clientX - drag.px) / UNIT;
    S.cy = drag.cy + (e.clientY - drag.py) / UNIT;
    draw();
  });
  ["pointerup","pointercancel"].forEach(function(ev){
    stage.addEventListener(ev, function(){ drag = null; stage.style.cursor = ""; });
  });
  stage.addEventListener("dblclick", function(){
    S.cx = 0; S.cy = 0; S.range = 13; draw();
  });

  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener("resize", resize);
  if (window.matchMedia){
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", draw);
  }

  pushToControls();
  resize();
})();
</script>
